version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
    # Dev-only deps (the shipped bundle is dependency-free); group the noise.
    groups:
      dev-dependencies:
        patterns: ["*"]
