version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
    ignore:
      # web-tree-sitter 0.26 and later reject the grammars `tree-sitter-wasms@^0.1.13` ships:
      # `Parser.init` succeeds, `Language.load` throws an Error with an EMPTY message, and nine
      # symbol-index tests go down with it. Measured on 0.26.13, and 0.27.0 was proposed next.
      #
      # Grouping the two does not fix this, which is the thing worth knowing: a dependabot group only
      # collects members that HAVE an update, and `tree-sitter-wasms` has published nothing newer --
      # so the group arrives holding web-tree-sitter alone. There is no version pair that works yet.
      #
      # Patches within 0.25.x still flow; only the minor and major steps are held, and dependabot
      # reads 0.25 -> 0.26 as minor because it treats every version as major.minor.patch.
      #
      # REMOVE THIS when `tree-sitter-wasms` publishes a release built for the newer ABI. That is the
      # signal, and it arrives on its own as the tree-sitter group's pull request.
      - dependency-name: "web-tree-sitter"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      # These two are coupled by the grammar ABI and must move together or not at all: 0.26 of the
      # runtime rejects the grammars `tree-sitter-wasms@^0.1.13` ships, and `Language.load` throws
      # an Error with an EMPTY message. One of them alone is a broken symbol index.
      tree-sitter:
        patterns: ["web-tree-sitter", "tree-sitter-wasms"]
      # The build's own tools, and these really are dev-only -- nothing here reaches a user.
      dev-dependencies:
        dependency-type: "development"
        patterns: ["*"]
    # Anything else -- the remaining runtime dependencies -- gets its OWN pull request, which is
    # what dependabot does for a dependency matching no group.
    #
    # This whole block used to be one group named `dev-dependencies` with `patterns: ["*"]`, on the
    # stated reasoning that "the shipped bundle is dependency-free". That reasoning is wrong:
    # `web-tree-sitter` and `tree-sitter-wasms` are vendored into `dist/vendor/` and ship, so a bump
    # arriving under a dev-dependency label changes the code users run. Measured twice, #65 and #86:
    # a `web-tree-sitter` bump rode in on a PR titled as dev noise and took nine symbol-index tests
    # with it, and the second time it did so with `js-yaml` for company.
