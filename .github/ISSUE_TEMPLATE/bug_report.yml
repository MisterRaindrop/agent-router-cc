name: Bug report
description: Something router did wrong — a command, a codex write or resume, a plans listing
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a codex write, the most useful evidence is its record —
        please attach it where the template asks.

        **Security issues:** do NOT file them here — see
        [SECURITY.md](../blob/main/SECURITY.md) for private reporting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did router do, and what did you expect instead?
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The commands you ran, in order, and the brief if a codex write was involved.
      placeholder: |
        1. /router:go with a plan that ...
        2. router write parser --brief .router/writes/parser/BRIEF.md
        3. ...
    validations:
      required: true
  - type: textarea
    id: run-record
    attributes:
      label: Write record
      description: >
        For a codex write, paste `.router/writes/<id>/record.json` and the tail of
        `.router/writes/<id>/codex.log`. Redact anything private.
      render: json
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: router version
      description: From `.claude-plugin/plugin.json`, or `node dist/router.js --version`.
      placeholder: 0.15.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, and the codex CLI version if a write or review was involved.
      placeholder: macOS 15 · node 22 · codex (plan)
    validations:
      required: true
  - type: dropdown
    id: gate-mode
    attributes:
      label: Real-gate mode
      options:
        - not configured
        - "mode: worktree"
        - "mode: queue"
      default: 0
    validations:
      required: false
