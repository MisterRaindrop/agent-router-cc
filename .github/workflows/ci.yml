name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Reproducible install from the committed lockfile.
      - run: npm ci
      # typecheck + core-purity guard + full test suite.
      # (Needs node 22+: the suite runs TypeScript directly via node --test.)
      - run: npm run check
      # The committed bundle must build and run on bare Node.
      - run: npm run build
      - run: node dist/router.js --version
      # ...and it must BE the build of the committed source. `dist/` is what the plugin
      # actually ships, so a stale bundle means users run old code while CI stays green --
      # that shipped a whole release self-reporting the previous version once already.
      - name: committed bundle is up to date with src
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is stale - run 'npm run build' and commit the result"
            exit 1
          fi

  # The shipped bundle declares `engines: node >= 18` — hold that promise on every
  # supported major, without the dev toolchain (the bundle is dependency-free).
  bundle-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node dist/router.js --version
      - run: node dist/router.js --help
