<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="router-feature" content="{{FEATURE_NAME}}">
  <meta name="router-base-sha" content="{{BASE_SHA}}">
  <meta name="router-head-sha" content="{{HEAD_SHA}}">
  <meta name="router-generated-at" content="{{GENERATED_AT}}">
  <meta name="router-scope" content="{{SCOPE}}">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>{{DOCUMENT_TITLE}}</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: light-dark(#ffffff, #151719);
      --ink: light-dark(#1d2025, #f2f4f7);
      --muted: light-dark(#6e747d, #a4aab3);
      --line: light-dark(#dde1e7, #34383e);
      --panel: light-dark(#f8f9fb, #1d2024);
      --node: light-dark(#ffffff, #24282d);
      --accent: light-dark(#2588f5, #65adff);
      --accent-soft: light-dark(#edf6ff, #142b42);
      --work: light-dark(#fff7ee, #2c241c);
      --work-line: light-dark(#efc99d, #6c5135);
      --warning: light-dark(#dc4f82, #ff83ae);
      --shadow: light-dark(0 8px 24px rgb(24 39 58 / 8%), 0 8px 24px rgb(0 0 0 / 22%));
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 320px; }

    body {
      background: var(--page);
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(1160px, calc(100% - 48px));
      margin: 0 auto;
      padding: 54px 0 64px;
    }

    header { max-width: 1080px; }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 1080px;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.12;
      letter-spacing: -.04em;
      font-weight: 700;
    }

    .verdict {
      margin: 18px 0 0;
      max-width: 920px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.78;
    }

    .verdict strong,
    .boundary strong,
    .issue strong { color: var(--ink); font-weight: 650; }

    .section-head {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 42px 0 14px;
    }

    h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.4;
      letter-spacing: -.01em;
    }

    .section-head span { color: var(--muted); font-size: 13px; }
    .diagram { width: 100%; overflow: hidden; }
    .diagram svg { display: block; width: 100%; height: auto; }
    .mobile-design { display: none; }

    .boundary {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .issue {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      margin-top: 34px;
      padding: 15px 0;
      border-top: 1px solid color-mix(in srgb, var(--warning) 50%, var(--line));
      border-bottom: 1px solid color-mix(in srgb, var(--warning) 50%, var(--line));
    }

    .issue-mark {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border: 1px solid var(--warning);
      border-radius: 50%;
      color: var(--warning);
      font-weight: 750;
    }

    .issue p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .issue-fix { font-size: 12px; font-weight: 700; white-space: nowrap; }

    code {
      padding: 2px 6px;
      border-radius: 6px;
      background: color-mix(in srgb, var(--ink) 8%, transparent);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .92em;
    }

    /* Reusable SVG vocabulary. Replace the complete SVG, but keep these classes. */
    .zone-control { fill: var(--accent-soft); stroke: color-mix(in srgb, var(--accent) 58%, var(--line)); }
    .zone-work { fill: var(--work); stroke: var(--work-line); }
    .zone-boundary { fill: none; stroke: var(--accent); stroke-width: 1.7; stroke-dasharray: 7 6; }
    .node { fill: var(--node); stroke: var(--line); filter: url(#node-shadow); }
    .node-key { fill: color-mix(in srgb, var(--accent) 10%, var(--node)); stroke: var(--accent); filter: url(#node-shadow); }
    .environment { fill: color-mix(in srgb, var(--work-line) 13%, var(--node)); stroke: var(--work-line); }
    .zone-title { fill: var(--ink); font-size: 19px; font-weight: 700; }
    .zone-caption { fill: var(--muted); font-size: 14px; }
    .node-title { fill: var(--ink); font-size: 17px; font-weight: 680; }
    .node-copy { fill: var(--muted); font-size: 13px; }
    .path { fill: none; stroke: var(--accent); stroke-width: 2.1; marker-end: url(#arrow-accent); }
    .path-neutral { fill: none; stroke: var(--ink); stroke-width: 1.8; marker-end: url(#arrow-neutral); }
    .edge-label { fill: var(--ink); font-size: 13px; font-weight: 650; paint-order: stroke; stroke: var(--page); stroke-width: 5px; stroke-linejoin: round; }
    .step-dot { fill: var(--accent); }
    .step-number { fill: var(--page); font-size: 12px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }

    .mobile-zone {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    .mobile-zone.control { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 58%, var(--line)); }
    .mobile-zone.work { margin-top: 12px; background: var(--work); border-color: var(--work-line); }
    .mobile-zone-title { margin: 0 0 8px; font-size: 14px; font-weight: 700; }
    .mobile-zone-caption { margin: 0 0 8px; color: var(--muted); font-size: 12px; line-height: 1.55; }

    .mobile-step {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: 10px;
      padding: 11px 0;
    }

    .mobile-step + .mobile-step { border-top: 1px solid color-mix(in srgb, var(--ink) 10%, transparent); }
    .mobile-index { display: grid; place-items: center; width: 25px; height: 25px; border-radius: 50%; background: var(--accent); color: var(--page); font-size: 11px; font-weight: 800; }
    .mobile-step strong { display: block; font-size: 13px; line-height: 1.45; }
    .mobile-step span:last-child { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .mobile-note { margin-top: 10px; padding: 11px 12px; border-left: 3px solid var(--work-line); background: color-mix(in srgb, var(--work-line) 11%, var(--node)); color: var(--muted); font-size: 12px; line-height: 1.55; }
    .mobile-note strong { color: var(--ink); }

    @media (max-width: 820px) {
      main { width: min(100% - 28px, 740px); padding: 34px 0 46px; }
      .verdict { font-size: 15px; }
      .section-head { margin-top: 34px; }
      .section-head span { display: none; }
      .diagram .desktop-design { display: none; }
      .mobile-design { display: block; }
      .issue { grid-template-columns: 30px 1fr; }
      .issue-fix { grid-column: 2; }
    }
  </style>
</head>
<body>
  <!-- Replace every {{...}} token. Omit the complete issue block when no concrete issue changes the verdict. -->
  <main>
    <header data-slot="summary">
      <p class="eyebrow">{{FEATURE_LABEL}}</p>
      <h1>{{TITLE}}</h1>
      <div class="verdict">{{VERDICT_HTML}}</div>
    </header>

    <section aria-labelledby="design-title" data-slot="design">
      <div class="section-head">
        <h2 id="design-title">{{DESIGN_HEADING}}</h2>
        <span>{{DESIGN_CAPTION}}</span>
      </div>
      <div class="diagram">
        {{DESKTOP_DIAGRAM_SVG}}
        {{MOBILE_DESIGN_HTML}}
      </div>
      <p class="boundary">{{CORE_BOUNDARY_HTML}}</p>
    </section>

    {{ISSUE_HTML}}
  </main>
</body>
</html>
